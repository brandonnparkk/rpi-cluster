<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>rpi-cluster architecture</title>
<desc>Developer pushes to GitHub, Flux polls and syncs the repo into two Kustomizations (apps and monitoring) inside the Raspberry Pi Kubernetes cluster. The apps Kustomization deploys linkding and cloudflared; linkding writes to a PVC. The monitoring Kustomization deploys kube-prometheus-stack. Internet users reach linkding through cloudflared via an outbound Cloudflare Tunnel.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>

<g stroke="#5F5E5A" stroke-width="0.75" marker-end="url(#arrow)">
<line x1="200" y1="76" x2="264" y2="76"/>
<line x1="430" y1="76" x2="464" y2="76"/>
<line x1="550" y1="102" x2="200" y2="185"/>
<line x1="550" y1="102" x2="468" y2="185"/>
<line x1="195" y1="242" x2="145" y2="297"/>
<line x1="195" y1="242" x2="295" y2="297"/>
<line x1="465" y1="242" x2="507" y2="297"/>
<line x1="230" y1="328" x2="214" y2="328"/>
<line x1="140" y1="354" x2="140" y2="409"/>
<line x1="315" y1="414" x2="302" y2="359"/>
</g>
<text x="330" y="388" font-size="12" fill="#444441" text-anchor="start">via Cloudflare Tunnel</text>

<rect x="50" y="150" width="585" height="230" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="65" y="168" font-size="12" fill="#888780" text-anchor="start">Raspberry Pi Kubernetes cluster</text>

<g>
<rect x="70" y="50" width="130" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135" y="71" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Developer</text>
<text x="135" y="88" font-size="12" fill="#5F5E5A" text-anchor="middle">git push</text>
</g>
<g>
<rect x="270" y="50" width="160" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="71" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">GitHub repo</text>
<text x="350" y="88" font-size="12" fill="#5F5E5A" text-anchor="middle">source repo</text>
</g>
<g>
<rect x="470" y="50" width="160" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="71" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">Flux</text>
<text x="550" y="88" font-size="12" fill="#534AB7" text-anchor="middle">controllers</text>
</g>

<g>
<rect x="90" y="190" width="210" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="195" y="211" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">apps Kustomization</text>
<text x="195" y="228" font-size="12" fill="#993C1D" text-anchor="middle">decrypts via SOPS/age</text>
</g>
<g>
<rect x="340" y="190" width="250" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="465" y="211" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">monitoring Kustomization</text>
<text x="465" y="228" font-size="12" fill="#0F6E56" text-anchor="middle">HelmRelease sync</text>
</g>

<g>
<rect x="70" y="302" width="140" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="140" y="323" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">linkding</text>
<text x="140" y="340" font-size="12" fill="#993C1D" text-anchor="middle">bookmark manager</text>
</g>
<g>
<rect x="230" y="302" width="140" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="300" y="323" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">cloudflared</text>
<text x="300" y="340" font-size="12" fill="#993C1D" text-anchor="middle">tunnel client</text>
</g>
<g>
<rect x="390" y="302" width="240" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
