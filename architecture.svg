<text x="510" y="340" font-size="12" fill="#0F6E56" text-anchor="middle">Prometheus + Grafana</text>
</g>

<g>
<rect x="70" y="414" width="140" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="140" y="435" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">PVC</text>
<text x="140" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">1Gi storage</text>
</g>
<g>
<rect x="230" y="414" width="170" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="315" y="435" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Internet user</text>
<text x="315" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">HTTPS request</text>
</g>

<rect x="50" y="486" width="12" height="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="68" y="496" font-size="12" fill="#444441" text-anchor="start">external / infra</text>
<rect x="230" y="486" width="12" height="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="248" y="496" font-size="12" fill="#444441" text-anchor="start">GitOps control plane</text>
<rect x="430" y="486" width="12" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="448" y="496" font-size="12" fill="#444441" text-anchor="start">app workload</text>
<rect x="520" y="486" width="12" height="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="538" y="496" font-size="12" fill="#444441" text-anchor="start">monitoring</text>
</svg>
